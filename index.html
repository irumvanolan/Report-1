<style>
:root{
  --primary:#1769aa;
  --primary-dark:#124e80;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#243447;
  --muted:#718096;
  --line:#e2e8f0;
  --green:#218c68;
  --red:#c94c4c;
  --orange:#c88732;
  --shadow:0 5px 18px rgba(30,60,90,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:650;
  transition:background .2s,transform .2s;
}
button:hover{transform:translateY(-1px)}
.primary{background:var(--primary);color:#fff}
.primary:hover{background:var(--primary-dark)}
.secondary{background:#eaf2f9;color:var(--primary-dark)}
.success{background:#e8f5ee;color:#218c68}
.danger{background:#fff0f0;color:var(--red)}
input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d6e0ea;
  border-radius:9px;
  background:#fff;
  color:var(--text);
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px #1769aa16;
}
label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.form-group{margin-bottom:15px}
.hidden{display:none!important}
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(140deg,#e9f1f8,#f8fafc 65%);
}
.login-card{
  width:100%;
  max-width:410px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:30px;
  box-shadow:0 15px 45px #24344712;
}
.brand-mark{
  width:52px;height:52px;
  display:grid;place-items:center;
  border-radius:13px;
  background:var(--primary);
  color:#fff;font-size:25px;font-weight:800;
}
.login-card h1{margin:17px 0 6px;font-size:27px}
.login-card p{color:var(--muted);line-height:1.6}
#app{min-height:100vh}
.topbar{
  height:68px;
  position:sticky;top:0;z-index:10;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 25px;gap:15px;
}
.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800}
.brand .brand-mark{width:39px;height:39px;border-radius:10px;font-size:20px}
.top-actions{display:flex;align-items:center;gap:9px}
.user-chip{padding:9px 12px;background:#f0f4f8;border-radius:9px;font-size:12px;font-weight:700}
.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 68px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 13px}
.nav-label{font-size:10px;color:#9aa7b5;font-weight:800;letter-spacing:1px;padding:12px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:11px;
  text-align:left;background:transparent;color:#526477;
  margin-bottom:4px;padding:12px;border-radius:9px;
}
.nav-btn .nav-icon{width:22px;text-align:center;font-size:16px}
.nav-btn:hover{background:#f4f7fa}
.nav-btn.active{background:#eaf2f9;color:var(--primary-dark);font-weight:750}
.main{padding:26px;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}
.page-head h1{margin:0 0 7px;font-size:26px;font-weight:750}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat-card,.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:var(--shadow);
}
.stat-card{padding:18px}
.stat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:650}
.stat-icon{width:37px;height:37px;border-radius:10px;display:grid;place-items:center;background:#eaf2f9;font-size:18px}
.stat-value{font-size:25px;font-weight:800;margin:15px 0 5px;overflow-wrap:anywhere;color:var(--text)}
.stat-note{font-size:11px;color:var(--muted)}
.content-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr);gap:16px;margin-bottom:18px}
.panel{padding:19px;margin-bottom:18px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-head h2{font-size:16px;margin:0}
.panel-head p{font-size:12px;color:var(--muted);margin:5px 0 0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:610px}
th,td{text-align:left;padding:12px 11px;border-bottom:1px solid #edf1f5;font-size:12px;vertical-align:middle}
th{background:#f7f9fc;color:#748396;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:#f9fbfd}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:7px;font-size:10px;font-weight:750;background:#f0f4f8;color:#526477}
.badge.green{background:#e8f5ee;color:#218c68}
.badge.blue{background:#eaf2f9;color:#1769aa}
.badge.orange{background:#fff4e5;color:#b7791f}
.badge.red{background:#fff0f0;color:#c94c4c}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.toolbar input{max-width:310px}
.toolbar select{max-width:210px}
.empty{text-align:center;padding:27px;color:var(--muted);font-size:13px}
.notice{padding:12px 14px;border-radius:9px;background:#eaf2f9;color:#285c83;font-size:12px;line-height:1.6;margin-bottom:16px}
.notice.warning{background:#fff4e5;color:#9a6419}
.notice.error{background:#fff0f0;color:#b42318}
.notice.success-note{background:#e8f5ee;color:#218c68}
.quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.quick-actions button{
  padding:14px;text-align:left;display:flex;gap:10px;align-items:center;
  background:#f8fafc;color:#344054;border:1px solid var(--line);
}
.quick-actions button:hover{background:#eaf2f9}
.quick-actions button span{font-size:19px}
.progress{height:7px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:9px}
.progress span{display:block;height:100%;background:var(--primary);border-radius:99px}
.product-line{display:grid;grid-template-columns:minmax(0,1.5fr) 85px 105px 35px;gap:8px;align-items:center;margin-bottom:9px}
.product-line button{padding:10px}
.toast{position:fixed;bottom:20px;right:20px;z-index:100;background:#243447;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);max-width:calc(100vw - 40px);font-size:13px}
.loading{padding:35px;text-align:center;color:var(--muted)}
.footer-note{text-align:center;color:#9aa7b5;font-size:11px;padding:17px}
@media(max-width:1100px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content-grid{grid-template-columns:1fr}
  .layout{grid-template-columns:205px minmax(0,1fr)}
  .main{padding:20px}
}
@media(max-width:760px){
  .topbar{height:60px;padding:0 12px}
  .brand{font-size:16px}
  .brand .brand-mark{width:35px;height:35px}
  .user-chip{display:none}
  .layout{display:block}
  .sidebar{
    position:sticky;top:60px;z-index:9;
    border-right:0;border-bottom:1px solid var(--line);
    padding:7px;overflow-x:auto;display:flex;gap:4px;
  }
  .nav-label{display:none}
  .nav-btn{width:auto;min-width:max-content;margin:0;padding:10px;font-size:11px;gap:6px}
  .nav-btn .nav-icon{font-size:14px}
  .main{padding:14px 11px}
  .page-head h1{font-size:22px}
  .cards{gap:9px}
  .stat-card{padding:12px}
  .stat-value{font-size:20px}
  .stat-top{font-size:10px}
  .stat-icon{width:31px;height:31px}
  .panel{padding:14px;border-radius:11px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .product-line{grid-template-columns:minmax(0,1fr) 60px 78px 32px;gap:5px}
  .product-line input,.product-line select{padding:9px 6px;font-size:11px}
  .quick-actions{grid-template-columns:1fr 1fr}
}
@media print{
  body{background:white}
  .topbar,.sidebar,.no-print,#loginScreen{display:none!important}
  .layout{display:block}
  .main{padding:0}
  .panel{box-shadow:none;border:0;padding:0}
  table{min-width:0}
  th,td{font-size:10px;padding:6px}
}
</style>
