<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report 1</title>
<style>
:root{
  --blue:#28628f;
  --blue-dark:#204d70;
  --bg:#f3f6fa;
  --white:#fff;
  --text:#253447;
  --muted:#748195;
  --line:#e3e9f0;
  --green:#287d60;
  --red:#b94b4b;
  --shadow:0 4px 16px rgba(35,55,80,.055);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;font-size:14px}
button,input,select{font:inherit}
button{border:0;border-radius:8px;padding:11px 15px;font-weight:650;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input,select{width:100%;padding:11px;border:1px solid #d5dee8;border-radius:8px;background:white;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #28628f16}
label{display:block;font-weight:650;font-size:12px;margin-bottom:7px}
.form-group{margin-bottom:15px}
.primary{background:var(--blue);color:white}
.primary:hover{background:var(--blue-dark)}
.secondary{background:#eaf0f6;color:var(--blue-dark)}
.danger{background:#fff0f0;color:var(--red)}
.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#e7eff7,#f8fafc)}
.login-card{width:100%;max-width:400px;padding:30px;background:white;border:1px solid var(--line);border-radius:17px;box-shadow:0 15px 45px #263e5610}
.logo{width:48px;height:48px;display:grid;place-items:center;background:var(--blue);color:white;font-size:24px;font-weight:900;border-radius:12px}
.login-card h1{font-size:27px;margin:17px 0 7px}
.muted{color:var(--muted)}
.small{font-size:12px}
#app{min-height:100vh}
.topbar{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 23px;position:sticky;top:0;z-index:10;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}
.brand .logo{width:37px;height:37px;font-size:19px;border-radius:9px}
.top-actions{display:flex;align-items:center;gap:8px}
.user-chip{background:#f0f4f8;padding:9px 11px;border-radius:8px;font-size:12px;font-weight:700}
.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 66px)}
.sidebar{background:white;border-right:1px solid var(--line);padding:17px 12px}
.nav-label{font-size:10px;font-weight:800;color:#9aa6b5;letter-spacing:1px;padding:11px}
.nav-btn{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;color:#58677a;margin-bottom:4px;padding:12px;border-radius:8px}
.nav-btn:hover{background:#f4f7fa}
.nav-btn.active{background:#eaf0f6;color:var(--blue-dark);font-weight:750}
.nav-icon{width:22px;text-align:center;font-size:16px}
.main{padding:25px;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
.page-head h1{font-size:25px;margin:0 0 6px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}
.stat-card,.panel{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.stat-card{padding:17px}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:650}
.stat-icon{width:35px;height:35px;display:grid;place-items:center;background:#eaf0f6;border-radius:9px;font-size:17px}
.stat-value{font-size:24px;font-weight:800;margin:14px 0 5px;overflow-wrap:anywhere}
.stat-note{font-size:11px;color:var(--muted)}
.panel{padding:19px;margin-bottom:17px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.panel-head h2{font-size:16px;margin:0}
.panel-head p{font-size:12px;color:var(--muted);margin:5px 0 0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.form-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.toolbar input{max-width:300px}
.table-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;min-width:580px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf1f5;font-size:12px}
th{background:#f7f9fc;color:#758397;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:#f9fbfd}
.badge{display:inline-block;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:750;background:#edf1f5;color:#536477}
.badge.blue{background:#eaf0f6;color:#285e88}
.badge.green{background:#e8f4ed;color:#287d60}
.notice{padding:12px 14px;background:#eaf0f6;color:#315d7f;border-radius:8px;font-size:12px;line-height:1.6;margin-bottom:15px}
.notice.error{background:#fff0f0;color:#a83b3b}
.notice.success{background:#e8f4ed;color:#287d60}
.empty,.loading{text-align:center;padding:28px;color:var(--muted)}
.quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.quick-actions button{background:#f7f9fc;border:1px solid var(--line);color:var(--text);text-align:left;display:flex;align-items:center;gap:10px;padding:13px}
.quick-actions button:hover{background:#eaf0f6}
.quick-actions span{font-size:19px}
.product-line{display:grid;grid-template-columns:minmax(0,1fr) 90px 100px 34px;gap:7px;margin-bottom:9px}
.product-line button{padding:8px}
.toast{position:fixed;bottom:20px;right:20px;z-index:100;background:#253447;color:white;padding:13px 17px;border-radius:9px;box-shadow:var(--shadow);max-width:90%;font-size:13px}
.footer{text-align:center;color:#9aa6b5;font-size:11px;padding:15px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:195px minmax(0,1fr)}}
@media(max-width:760px){
 .topbar{height:58px;padding:0 11px}.brand{font-size:16px}.brand .logo{width:34px;height:34px}.user-chip{display:none}
 .layout{display:block}.sidebar{position:sticky;top:58px;z-index:9;display:flex;gap:4px;overflow-x:auto;padding:7px;border-right:0;border-bottom:1px solid var(--line)}
 .nav-label{display:none}.nav-btn{width:auto;min-width:max-content;margin:0;padding:10px;font-size:11px;gap:6px}
 .main{padding:14px 10px}.page-head h1{font-size:22px}.cards{gap:8px}
 .stat-card{padding:12px}.stat-value{font-size:19px}.stat-top{font-size:10px}.stat-icon{width:30px;height:30px}
 .panel{padding:14px}.grid-2,.grid-3{grid-template-columns:1fr}
 .product-line{grid-template-columns:minmax(0,1fr) 55px 75px 30px;gap:4px}
 .product-line input,.product-line select{padding:9px 5px;font-size:11px}
 .quick-actions{grid-template-columns:1fr 1fr}
}
@media print{
 .topbar,.sidebar,.no-print,#loginScreen{display:none!important}
 .layout{display:block}.main{padding:0}.panel,.stat-card{box-shadow:none}
}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="logo">R</div>
    <h1>Report 1</h1>
    <p class="muted">Sisitemu icunga ibicuruzwa, amashami n'igurisha.</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Izina ryo kwinjira</label>
        <input id="username" name="username" autocomplete="username" required placeholder="Andika izina">
      </div>
      <div class="form-group">
        <label for="password">Ijambo ry'ibanga</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Andika ijambo ry'ibanga">
      </div>
      <button class="primary" type="submit" style="width:100%">Injira →</button>
      <p id="loginMessage" class="small" role="status"></p>
    </form>
    <div class="footer">REPORT 1 · UBucuruzi BWOROSHYE</div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><div class="logo">R</div><span>Report 1</span></div>
    <div class="top-actions">
      <span id="userChip" class="user-chip">Umukoresha</span>
      <button class="secondary" id="refreshBtn" title="Kuvugurura">↻</button>
      <button class="danger" id="logoutBtn">Sohoka</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="nav-label">MENU NKURU</div>
      <button class="nav-btn active" data-page="dashboard"><span class="nav-icon">▦</span> Incamake</button>
      <button class="nav-btn" data-page="products"><span class="nav-icon">▣</span> Ibicuruzwa</button>
      <button class="nav-btn" data-page="stock"><span class="nav-icon">▤</span> Stock y'amashami</button>
      <button class="nav-btn admin-only" data-page="transfers"><span class="nav-icon">⇄</span> Kohereza stock</button>
      <button class="nav-btn" data-page="sales"><span class="nav-icon">🛒</span> Gurisha</button>
      <button class="nav-btn" data-page="history"><span class="nav-icon">◷</span> Amateka y'igurisha</button>
      <button class="nav-btn" data-page="movements"><span class="nav-icon">↕</span> Amateka ya stock</button>
      <button class="nav-btn" data-page="reports"><span class="nav-icon">▥</span> Raporo</button>
      <button class="nav-btn admin-only" data-page="users"><span class="nav-icon">♙</span> Abakozi</button>
    </aside>
    <main id="mainContent" class="main"><div class="loading">Birimo gufunguka...</div></main>
  </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("rw-RW",{maximumFractionDigits:2}).format(Number(n)||0)+" RWF";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get=(o,...keys)=>{for(const k of keys)if(o?.[k]!==undefined&&o[k]!==null)return o[k];return "";};
const dateText=v=>{if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):esc(d.toLocaleString("rw-RW"));};

let user=null,data={},products=[],branches=[],sales=[],movements=[],saleLines=[],toastTimer;

function admin(){return user?.role==="admin";}
function notify(msg,error=false){
  const t=$("toast");t.textContent=msg;t.style.background=error?"#a83b3b":"#253447";t.classList.remove("hidden");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add("hidden"),3500);
}
async function api(url,options={}){
  const opt={credentials:"same-origin",...options,headers:{...(options.headers||{})}};
  if(opt.body&&typeof opt.body!=="string"){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body);}
  let res;
  try{res=await fetch(url,opt);}catch(e){throw new Error("Server ntiboneka. Ongera ugerageze.");}
  const raw=await res.text();let result={};
  try{result=raw?JSON.parse(raw):{};}catch{result={};}
  if(!res.ok)throw new Error(result.error||result.message||"Ikibazo cya server ("+res.status+").");
  return result;
}
function showLogin(msg=""){
  $("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");$("loginMessage").textContent=msg;
}
function showApp(){
  $("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");
  $("userChip").textContent=(user?.name||user?.username||"Umukoresha")+" · "+(user?.role||"");
  document.querySelectorAll(".admin-only").forEach(el=>el.classList.toggle("hidden",!admin()));
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const btn=e.submitter;btn.disabled=true;$("loginMessage").textContent="Birimo kugenzura...";
  try{const r=await api("/api/login",{method:"POST",body:{username:$("username").value.trim(),password:$("password").value}});user=r.user;await loadData();}
  catch(err){$("loginMessage").textContent=err.message;}
  finally{btn.disabled=false;}
});
$("logoutBtn").addEventListener("click",async()=>{
  try{await api("/api/logout",{method:"POST"});}catch(e){}
  user=null;showLogin();
});
$("refreshBtn").addEventListener("click",()=>loadData().catch(e=>notify(e.message,true)));
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));

async function loadData(){
  $("mainContent").innerHTML='<div class="loading">Birimo kuvugurura amakuru...</div>';
  const me=await api("/api/me");
  if(!me.user){user=null;showLogin();return;}
  user=me.user;
  const r=await api("/api/data");
  data=r;products=r.products||[];branches=r.branches||[];sales=r.sales||[];
  showApp();await render();
}
async function loadHistory(){
  try{const r=await api("/api/history");movements=r.history||[];}catch(e){movements=[];}
}
async function render(){
  const page=document.querySelector(".nav-btn.active")?.dataset.page||"dashboard";
  await showPage(page);
}
function go(page){
  if(!admin()&&["transfers","users"].includes(page))page="dashboard";
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  showPage(page);
}
async function showPage(page){
  if(!admin()&&["transfers","users"].includes(page))page="dashboard";
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  if(page==="dashboard")return dashboard();
  if(page==="products")return productsPage();
  if(page==="stock")return stockPage();
  if(page==="transfers")return transfersPage();
  if(page==="sales")return salesPage();
  if(page==="history")return historyPage();
  if(page==="movements")return movementsPage();
  if(page==="reports")return reportsPage();
  if(page==="users")return usersPage();
}
function head(title,sub,action=""){
  return '<div class="page-head"><div><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>'+action+'</div>';
}
function panel(title,body,sub=""){
  return '<section class="panel"><div class="panel-head"><div><h2>'+esc(title)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':"")+'</div></div>'+body+'</section>';
}
function stat(title,value,icon,note){
  return '<div class="stat-card"><div class="stat-top"><span>'+esc(title)+'</span><span class="stat-icon">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-note">'+esc(note)+'</div></div>';
}
function table(headers,rows){
  if(!rows.length)return '<div class="empty">Nta makuru arahari.</div>';
  return '<div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'+
  rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>';
}
function productLabel(id){const p=products.find(p=>String(p.id)===String(id));return p?get(p,"name"):"Igicuruzwa #"+id;}
function branchLabel(id){const b=branches.find(b=>String(b.id)===String(id));return b?get(b,"name"):"Ishami #"+id;}
function options(items,selected=""){
  return items.map(x=>'<option value="'+esc(x.id)+'" '+(String(x.id)===String(selected)?"selected":"")+'>'+esc(x.name)+'</option>').join("");
}
function stockForBranch(branchId){
  const map=new Map();
  products.forEach(p=>{if(String(p.branch_id)===String(branchId))map.set(String(p.id),Number(p.quantity)||0);});
  return map;
}
function dashboard(){
  const stock=products.reduce((sum,p)=>sum+(Number(p.quantity)||0),0);
  const total=sales.reduce((sum,s)=>sum+(Number(s.total)||0),0);
  const rows=sales.slice(0,7).map(s=>[
    '<b>#'+esc(s.id)+'</b>',esc(s.branch_name||branchLabel(s.branch_id)),
    money(s.total),esc(s.username||"—"),dateText(s.created_at)
  ]);
  $("mainContent").innerHTML=head("Incamake","Reba uko ibikorwa by'ubucuruzi bihagaze.")+
    '<div class="cards">'+
    stat("Ibicuruzwa",new Set(products.map(p=>p.id)).size,"▣","Ibicuruzwa biri muri sisitemu")+
    stat("Amashami",branches.length,"⌂","Amashami aboneka kuri konti")+
    stat("Stock igaragara",stock,"▤","Igiteranyo cya stock y'amashami")+
    stat("Igurisha ryose",money(total),"↗","Amateka y'igurisha aboneka")+
    '</div><div class="content-grid">'+
    panel("Ibikorwa byihuse",'<div class="quick-actions">'+
      '<button onclick="go(\'sales\')"><span>🛒</span><div><b>Gurisha</b><div class="small muted">Andika igurisha</div></div></button>'+
      '<button onclick="go(\'stock\')"><span>📦</span><div><b>Reba stock</b><div class="small muted">Stock y\'amashami</div></div></button>'+
      (admin()?'<button onclick="go(\'products\')"><span>▣</span><div><b>Ibicuruzwa</b><div class="small muted">Ongeramo igicuruzwa</div></div></button><button onclick="go(\'transfers\')"><span>⇄</span><div><b>Kohereza stock</b><div class="small muted">Ohereza ku ishami</div></div></button>':'')+
    '</div>')+
    panel("Amashami",branches.map(b=>'<div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px"><b>'+esc(b.name)+'</b><span class="badge blue">Ishami</span></div>').join("")||'<div class="empty">Nta mashami ahari.</div>')+
    '</div>'+panel("Ibyagurishijwe vuba",table(["Nimero","Ishami","Amafaranga","Umukozi","Itariki"],rows));
}
function productsPage(){
  $("mainContent").innerHTML=head("Ibicuruzwa","Catalog imwe y'ibicuruzwa ikoreshwa n'amashami.")+
    (admin()?'<div class="panel"><div class="panel-head"><h2>Ongeramo igicuruzwa</h2></div><form id="productForm"><div class="grid-3">'+
    '<div class="form-group"><label>Izina ry\'igicuruzwa *</label><input id="pName" required maxlength="150" placeholder="Urugero: Isukari"></div>'+
    '<div class="form-group"><label>Igiciro cyo kugurisha (RWF)</label><input id="pPrice" type="number" min="0" step="any" value="0" required></div>'+
    '<div class="form-group"><label>Igiciro cyo kugura (RWF)</label><input id="pCost" type="number" min="0" step="any" value="0" required></div>'+
    '</div><button class="primary" type="submit">+ Bika igicuruzwa</button></form></div>':'')+
    '<div class="panel"><div class="toolbar"><input id="productSearch" placeholder="Shakisha igicuruzwa..."></div><div id="productTable"></div></div>';
  function draw(){
    const q=($("productSearch").value||"").toLowerCase();
    const list=products.filter(p=>String(p.name).toLowerCase().includes(q));
    $("productTable").innerHTML=table(["ID","Igicuruzwa","Igiciro cyo kugurisha","Stock y'ishami"],list.map(p=>[
      esc(p.id),'<b>'+esc(p.name)+'</b>',money(p.selling_price),
      esc(p.quantity??0)
    ]));
  }
  $("productSearch").addEventListener("input",draw);draw();
  if(admin())$("productForm").addEventListener("submit",async e=>{
    e.preventDefault();const btn=e.submitter;btn.disabled=true;
    try{
      await api("/api/products",{method:"POST",body:{name:$("pName").value.trim(),sellingPrice:Number($("pPrice").value),costPrice:Number($("pCost").value)}});
      notify("Igicuruzwa cyongeweho.");await loadData();go("products");
    }catch(err){notify(err.message,true);}finally{btn.disabled=false;}
  });
}
function stockPage(){
  $("mainContent").innerHTML=head("Stock y'amashami","Reba umubare wa buri gicuruzwa kuri buri shami.")+
    '<div class="panel"><div class="toolbar"><select id="stockBranch"><option value="">Amashami yose</option>'+options(branches)+'</select><input id="stockSearch" placeholder="Shakisha igicuruzwa..."></div><div id="stockTable"></div></div>';
  function draw(){
    const branch=$("stockBranch").value,q=$("stockSearch").value.toLowerCase();
    const rows=products.filter(p=>(!branch||String(p.branch_id)===branch)&&String(p.name).toLowerCase().includes(q)).map(p=>[
      '<b>'+esc(p.name)+'</b>',esc(branchLabel(p.branch_id)),
      '<b>'+esc(p.quantity??0)+'</b>',money(p.selling_price)
    ]);
    $("stockTable").innerHTML=table(["Igicuruzwa","Ishami","Stock","Igiciro"],rows);
  }
  $("stockBranch").addEventListener("change",draw);$("stockSearch").addEventListener("input",draw);draw();
}
function transfersPage(){
  if(!admin())return;
  $("mainContent").innerHTML=head("Kohereza stock","Admin yohereza ibicuruzwa ku ishami.")+
    '<div class="notice">Hitamo igicuruzwa, ishami n\'umubare. Iyi form ikoresha uburyo bwo kohereza stock buri muri server yawe.</div>'+
    '<div class="panel"><h2 style="margin-top:0">Ohereza ku ishami</h2><form id="transferForm"><div class="grid-2">'+
    '<div class="form-group"><label>Igicuruzwa *</label><select id="tProduct" required><option value="">Hitamo igicuruzwa</option>'+options(products.filter((p,i,a)=>a.findIndex(x=>x.id===p.id)===i))+'</select></div>'+
    '<div class="form-group"><label>Ishami ryakira *</label><select id="tBranch" required><option value="">Hitamo ishami</option>'+options(branches)+'</select></div>'+
    '<div class="form-group"><label>Umubare *</label><input id="tQty" type="number" min="1" step="1" required></div>'+
    '</div><button class="primary" type="submit">⇄ Kohereza stock</button></form></div>'+
    '<div class="notice">Icyitonderwa: server iriho ubu ntibika stock yigenga y\'ububiko bukuru. Iyi form yongerera stock ishami ryatoranyijwe.</div>';
  $("transferForm").addEventListener("submit",async e=>{
    e.preventDefault();const btn=e.submitter;btn.disabled=true;
    try{
      await api("/api/transfer",{method:"POST",body:{productId:Number($("tProduct").value),toBranch:Number($("tBranch").value),fromBranch:null,quantity:Number($("tQty").value)}});
      notify("Stock yoherejwe ku ishami.");await loadData();go("stock");
    }catch(err){notify(err.message,true);}finally{btn.disabled=false;}
  });
}
function salesPage(){
  const branchId=admin()?"":String(user.branchId);
  const productOptions=products.filter(p=>!admin()?String(p.branch_id)===branchId:true);
  $("mainContent").innerHTML=head("Gurisha","Andika amakuru y'igurisha n'ibicuruzwa.")+
    '<div class="panel"><form id="saleForm"><h2 style="margin-top:0">Amakuru y\'umukiriya</h2><div class="grid-2">'+
    '<div class="form-group"><label>Amazina y\'umukiriya *</label><input id="customerName" required placeholder="Andika amazina y\'umukiriya"></div>'+
    '<div class="form-group"><label>Telefoni y\'umukiriya *</label><input id="customerPhone" type="tel" required placeholder="Andika nimero ya telefoni"></div>'+
    (admin()?'<div class="form-group"><label>Ishami rigurisha *</label><select id="saleBranch" required><option value="">Hitamo ishami</option>'+options(branches)+'</select></div>':'<input id="saleBranch" type="hidden" value="'+esc(user.branchId)+'">')+
    '</div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">'+
    '<div class="panel-head"><div><h2>Ibicuruzwa</h2><p>Igiciro kiva muri catalog.</p></div><button type="button" class="secondary" id="addLine">+ Ongeraho</button></div>'+
    '<div id="saleLines"></div><div style="display:flex;justify-content:space-between;align-items:center;background:#f3f6fa;padding:14px;border-radius:9px;margin:15px 0"><b>Igiteranyo</b><strong id="saleTotal" style="font-size:21px;color:var(--blue)">0 RWF</strong></div>'+
    '<button type="submit" class="primary">✓ Emeza igurisha</button></form></div>';
  saleLines=[];addLine();
  $("addLine").addEventListener("click",addLine);
  $("saleForm").addEventListener("submit",submitSale);
}
function addLine(){
  saleLines.push({key:Date.now()+Math.random(),productId:"",quantity:1});
  drawLines();
}
function drawLines(){
  const box=$("saleLines");if(!box)return;
  const unique=products.filter((p,i,a)=>a.findIndex(x=>x.id===p.id)===i);
  box.innerHTML=saleLines.map(l=>'<div class="product-line" data-key="'+l.key+'"><select class="line-product" required><option value="">Hitamo igicuruzwa</option>'+options(unique,l.productId)+'</select><input class="line-qty" type="number" min="1" step="1" value="'+l.quantity+'" required><input class="line-price" value="'+esc(l.productId?(unique.find(p=>String(p.id)===String(l.productId))?.selling_price??0):0)+'" readonly aria-label="Igiciro"><button type="button" class="danger line-remove">×</button></div>').join("");
  box.querySelectorAll(".product-line").forEach(el=>{
    const line=saleLines.find(l=>String(l.key)===el.dataset.key);
    el.querySelector(".line-product").addEventListener("change",e=>{line.productId=e.target.value;drawLines();});
    el.querySelector(".line-qty").addEventListener("input",e=>{line.quantity=Number(e.target.value)||0;updateTotal();});
    el.querySelector(".line-remove").addEventListener("click",()=>{
      if(saleLines.length===1)return notify("Ugomba kugira igicuruzwa kimwe nibura.",true);
      saleLines=saleLines.filter(l=>l.key!==line.key);drawLines();
    });
  });
  updateTotal();
}
function updateTotal(){
  const total=saleLines.reduce((sum,l)=>{
    const p=products.find(p=>String(p.id)===String(l.productId));
    return sum+(Number(p?.selling_price)||0)*(Number(l.quantity)||0);
  },0);
  if($("saleTotal"))$("saleTotal").textContent=money(total);
}
async function submitSale(e){
  e.preventDefault();
  const branchId=Number($("saleBranch").value);
  if(!branchId)return notify("Hitamo ishami.",true);
  if(saleLines.some(l=>!l.productId||!Number.isInteger(Number(l.quantity))||Number(l.quantity)<1))return notify("Reba ibicuruzwa n'umubare.",true);
  const btn=e.submitter;btn.disabled=true;
  const customerName=$("customerName").value.trim(),customerPhone=$("customerPhone").value.trim();
  try{
    const result=await api("/api/sale",{method:"POST",body:{branchId,items:saleLines.map(l=>({productId:Number(l.productId),quantity:Number(l.quantity)}))}});
    const total=Number(result.total)||0;
    const receiptItems=saleLines.map(l=>{
      const p=products.find(p=>String(p.id)===String(l.productId));
      return {name:p?.name||"",quantity:l.quantity,price:Number(p?.selling_price)||0};
    });
    notify("Igurisha ryabitswe neza.");
    printReceipt({id:result.saleId,customerName,customerPhone,branchId,total,items:receiptItems,date:new Date().toLocaleString("rw-RW")});
    await loadData();go("sales");
  }catch(err){notify(err.message,true);}finally{btn.disabled=false;}
}
function printReceipt(s){
  const w=window.open("","_blank","width=420,height=650");
  if(!w)return notify("Emerera browser gufungura inyemezabuguzi.",true);
  const lines=s.items.map(i=>'<tr><td>'+esc(i.name)+' × '+esc(i.quantity)+'</td><td style="text-align:right">'+money(i.price*i.quantity)+'</td></tr>').join("");
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Inyemezabuguzi</title><style>body{font-family:Arial;max-width:340px;margin:20px auto;color:#222}h2,.center{text-align:center}table{width:100%;border-collapse:collapse}td{font-size:12px;padding:7px 0}.line{border-top:1px dashed #999;margin:13px 0}.total{display:flex;justify-content:space-between;font-size:17px;font-weight:bold}@media print{@page{size:80mm auto;margin:5mm}}</style></head><body><h2>REPORT 1</h2><div class="center">INYEMEZABUGUZI</div><div class="line"></div><p>Nimero: '+esc(s.id)+'</p><p>Umukiriya: '+esc(s.customerName)+'</p><p>Telefoni: '+esc(s.customerPhone)+'</p><p>Ishami: '+esc(branchLabel(s.branchId))+'</p><p>Itariki: '+esc(s.date)+'</p><div class="line"></div><table>'+lines+'</table><div class="line"></div><div class="total"><span>IGITERANYO</span><span>'+money(s.total)+'</span></div><div class="line"></div><div class="center">Murakoze kutugana!</div><script>window.onload=()=>window.print();<\/script></body></html>');
  w.document.close();
}
function historyPage(){
  const rows=sales.map(s=>[
    '<b>#'+esc(s.id)+'</b>',esc(s.branch_name||branchLabel(s.branch_id)),
    money(s.total),esc(s.username||"—"),dateText(s.created_at)
  ]);
  $("mainContent").innerHTML=head("Amateka y'igurisha","Reba ibyagurishijwe n'amafaranga yabyo.")+
    '<div class="panel"><div class="toolbar"><input id="historySearch" placeholder="Shakisha nimero cyangwa ishami..."><button class="secondary" onclick="loadData()">↻ Kuvugurura</button></div><div id="historyTable"></div></div>';
  const draw=()=>{const q=$("historySearch").value.toLowerCase();$("historyTable").innerHTML=table(["Nimero","Ishami","Amafaranga","Umukozi","Itariki"],rows.filter(r=>r.join(" ").toLowerCase().includes(q)));};
  $("historySearch").addEventListener("input",draw);draw();
}
async function movementsPage(){
  await loadHistory();
  const rows=movements.map(m=>[
    esc(m.movement_type),esc(m.product_name),esc(m.branch_name),
    esc(m.quantity),esc(m.username),esc(m.details||"—"),dateText(m.created_at)
  ]);
  $("mainContent").innerHTML=head("Amateka ya stock","Reba ibikorwa byabaye kuri stock.")+
    '<div class="panel"><div class="toolbar"><button class="secondary" onclick="showPage(\'movements\')">↻ Kuvugurura</button><button class="primary" onclick="window.print()">Shyira kuri printer</button></div>'+
    table(["Igikorwa","Igicuruzwa","Ishami","Umubare","Umukozi","Ibisobanuro","Itariki"],rows)+'</div>';
}
async function reportsPage(){
  let reportRows=[];
  try{const r=await api("/api/reports/sales");reportRows=r.reports||[];}catch(e){}
  const total=sales.reduce((s,x)=>s+Number(x.total||0),0);
  $("mainContent").innerHTML=head("Raporo","Incamake y'igurisha n'amashami.")+
    '<div class="cards">'+stat("Amafaranga yose",money(total),"↗","Igurisha rigaragara")+
    stat("Umubare w\'igurisha",sales.length,"▤","Amateka aboneka")+
    stat("Ibicuruzwa",new Set(products.map(p=>p.id)).size,"▣","Catalog")+
    stat("Amashami",branches.length,"⌂","Amashami aboneka")+'</div>'+
    panel("Raporo ku mashami",table(["Ishami","Umukozi","Umubare w'igurisha","Amafaranga yose"],reportRows.map(r=>[
      esc(r.branch_name),esc(r.username||"—"),esc(r.sales_count||0),money(r.total_sales)
    ])))+
    '<div class="panel"><div class="panel-head"><h2>Amateka y\'igurisha</h2><button class="primary" onclick="window.print()">Shyira kuri printer</button></div>'+
    table(["Nimero","Ishami","Amafaranga","Itariki"],sales.map(s=>[
      esc(s.id),esc(s.branch_name||branchLabel(s.branch_id)),money(s.total),dateText(s.created_at)
    ]))+'</div>';
}
function usersPage(){
  $("mainContent").innerHTML=head("Abakozi","Gucunga konti z'abakozi.")+
    '<div class="notice">Server iriho ubu ntifite API yo kureba cyangwa gukora konti z\'abakozi muri iyi page.</div>'+
    '<div class="panel"><h2>Amashami</h2>'+table(["ID","Izina ry'ishami"],branches.map(b=>[esc(b.id),esc(b.name)]))+'</div>';
}
(async()=>{
  try{const me=await api("/api/me");if(me.user){user=me.user;await loadData();}else showLogin();}
  catch(e){showLogin();}
})();
</script>
