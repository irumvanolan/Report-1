<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report 1 | Sisitemu y'Amashami</title>
<style>
:root {
  --primary:#155eef;
  --primary-dark:#1246b8;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --line:#e4eaf2;
  --green:#159b62;
  --red:#d92d20;
  --orange:#dc6803;
  --shadow:0 8px 28px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700;transition:.2s}
button:hover{filter:brightness(.96)}
input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #155eef1a}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.form-group{margin-bottom:15px}
.primary{background:var(--primary);color:white}
.secondary{background:#eaf1ff;color:var(--primary)}
.success{background:#e8f7ef;color:#087443}
.danger{background:#fff0ef;color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top right,#c7d7fe,transparent 35%),linear-gradient(135deg,#edf3ff,#f8fafc)}
.login-card{width:100%;max-width:430px;background:white;border-radius:22px;padding:32px;box-shadow:0 24px 70px #1d29391c}
.brand-mark{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#155eef,#528bff);color:white;font-size:26px;font-weight:900}
.login-card h1{margin:18px 0 5px;font-size:27px}
.login-card p{color:var(--muted);line-height:1.6}
#app{min-height:100vh}
.topbar{height:72px;position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:900}
.brand .brand-mark{width:40px;height:40px;border-radius:12px;font-size:20px}
.top-actions{display:flex;align-items:center;gap:10px}
.user-chip{padding:9px 12px;background:#f2f4f7;border-radius:10px;font-size:13px;font-weight:700}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 72px)}
.sidebar{background:white;border-right:1px solid var(--line);padding:20px 14px}
.nav-label{font-size:11px;color:#98a2b3;font-weight:900;letter-spacing:1px;padding:12px}
.nav-btn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#475467;margin-bottom:5px;padding:12px 13px}
.nav-btn .nav-icon{width:22px;text-align:center;font-size:17px}
.nav-btn.active{background:#edf3ff;color:var(--primary)}
.main{padding:28px;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.page-head h1{margin:0 0 7px;font-size:27px}
.page-head p{margin:0;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.stat-card,.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat-card{padding:20px}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:700}
.stat-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#edf3ff;font-size:21px}
.stat-value{font-size:28px;font-weight:900;margin:16px 0 5px;overflow-wrap:anywhere}
.stat-note{font-size:12px;color:var(--muted)}
.content-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px;margin-bottom:20px}
.panel{padding:21px;margin-bottom:20px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.panel-head h2{font-size:17px;margin:0}
.panel-head p{font-size:12px;color:var(--muted);margin:5px 0 0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #eef1f5;font-size:13px;vertical-align:middle}
th{background:#f9fafb;color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:#fafcff}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#f2f4f7;color:#475467}
.badge.green{background:#e8f7ef;color:#087443}
.badge.blue{background:#eaf1ff;color:#1849a9}
.badge.orange{background:#fff4e5;color:#b54708}
.badge.red{background:#fff0ef;color:#b42318}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{max-width:320px}
.toolbar select{max-width:220px}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:14px}
.notice{padding:13px 15px;border-radius:11px;background:#eff8ff;color:#175cd3;font-size:13px;line-height:1.6;margin-bottom:17px}
.notice.warning{background:#fffaeb;color:#b54708}
.notice.error{background:#fff0ef;color:#b42318}
.notice.success-note{background:#ecfdf3;color:#027a48}
.quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick-actions button{padding:15px;text-align:left;display:flex;gap:10px;align-items:center;background:#f8faff;color:#344054;border:1px solid var(--line)}
.quick-actions button span{font-size:20px}
.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:var(--primary);border-radius:99px}
.product-line{display:grid;grid-template-columns:minmax(0,1.5fr) 90px 110px 36px;gap:9px;align-items:center;margin-bottom:10px}
.product-line button{padding:10px}
.toast{position:fixed;bottom:22px;right:22px;z-index:100;background:#172033;color:white;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);max-width:calc(100vw - 44px);font-size:14px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.footer-note{text-align:center;color:#98a2b3;font-size:12px;padding:18px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}.layout{grid-template-columns:210px minmax(0,1fr)}.main{padding:20px}}
@media(max-width:760px){
 .topbar{height:62px;padding:0 13px}.brand{font-size:16px}.brand .brand-mark{width:36px;height:36px}.user-chip{display:none}
 .layout{display:block}.sidebar{position:sticky;top:62px;z-index:9;border-right:0;border-bottom:1px solid var(--line);padding:8px;overflow-x:auto;display:flex;gap:5px}
 .nav-label{display:none}.nav-btn{width:auto;min-width:max-content;margin:0;padding:10px;font-size:12px;gap:7px}.nav-btn .nav-icon{font-size:15px}
 .main{padding:16px 12px}.page-head h1{font-size:23px}.page-head{margin-bottom:18px}
 .cards{gap:10px}.stat-card{padding:14px}.stat-value{font-size:22px}.stat-top{font-size:11px}.stat-icon{width:34px;height:34px}
 .panel{padding:15px;border-radius:13px}.grid-2,.grid-3{grid-template-columns:1fr}.product-line{grid-template-columns:minmax(0,1fr) 65px 85px 34px;gap:5px}
 .product-line input,.product-line select{padding:10px 7px;font-size:12px}.quick-actions{grid-template-columns:1fr 1fr}
}
@media print{
 body{background:white}
 .topbar,.sidebar,.no-print,#loginScreen,#app>.topbar{display:none!important}
 .layout{display:block}.main{padding:0}.panel{box-shadow:none;border:0;padding:0}
 .print-area{display:block!important}
 table{min-width:0}th,td{font-size:10px;padding:6px}
}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="brand-mark">R</div>
    <h1>Report 1</h1>
    <p>Sisitemu icunga ububiko, amashami, ibicuruzwa n'igurisha ahantu hamwe.</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Izina ryo kwinjira</label>
        <input id="username" name="username" autocomplete="username" placeholder="Andika izina ryawe" required>
      </div>
      <div class="form-group">
        <label for="password">Ijambo ry'ibanga</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Andika ijambo ry'ibanga" required>
      </div>
      <button class="primary" type="submit" style="width:100%;padding:14px">Injira muri sisitemu →</button>
      <p id="loginMessage" class="small" role="status"></p>
    </form>
    <div class="footer-note">Report 1 · Sisitemu y'ubucuruzi</div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">R</div><span>Report 1</span></div>
    <div class="top-actions">
      <span id="userChip" class="user-chip">Umukoresha</span>
      <button class="secondary" id="refreshBtn" title="Kuvugurura">↻</button>
      <button class="danger" id="logoutBtn">Sohoka</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="nav-label">MENU NKURU</div>
      <button class="nav-btn active" data-page="dashboard"><span class="nav-icon">▦</span> Incamake</button>
      <button class="nav-btn" data-page="products"><span class="nav-icon">▣</span> Ibicuruzwa</button>
      <button class="nav-btn" data-page="warehouse"><span class="nav-icon">▤</span> Ububiko bukuru</button>
      <button class="nav-btn" data-page="transfers"><span class="nav-icon">⇄</span> Kohereza stock</button>
      <button class="nav-btn" data-page="sales"><span class="nav-icon">🛒</span> Gurisha</button>
      <button class="nav-btn" data-page="history"><span class="nav-icon">◷</span> Amateka y'igurisha</button>
      <button class="nav-btn" data-page="movements"><span class="nav-icon">↕</span> Amateka ya stock</button>
      <button class="nav-btn" data-page="reports"><span class="nav-icon">▥</span> Raporo</button>
      <button class="nav-btn" data-page="users"><span class="nav-icon">♙</span> Abakozi</button>
    </aside>
    <main id="mainContent" class="main"><div class="loading">Birimo gufunguka...</div></main>
  </div>
</div>

<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const money = value => new Intl.NumberFormat("rw-RW",{maximumFractionDigits:2}).format(Number(value)||0) + " RWF";
const dateText = value => {
  if(!value) return "—";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString("rw-RW");
};
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
let currentUser = null;
let appData = {};
let currentPage = "dashboard";
let productsCache = [];
let branchesCache = [];
let saleLines = [];
let toastTimer;

function toast(message, isError=false){
  const el=$("toast");
  el.textContent=message;
  el.style.background=isError?"#b42318":"#172033";
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add("hidden"),3500);
}

async function api(url, options={}){
  const config={credentials:"same-origin",...options,headers:{...(options.headers||{})}};
  if(config.body && typeof config.body!=="string"){
    config.headers["Content-Type"]="application/json";
    config.body=JSON.stringify(config.body);
  }
  let response;
  try{
    response=await fetch(url,config);
  }catch(e){
    throw new Error("Internet cyangwa server ntiboneka. Ongera ugerageze.");
  }
  const text=await response.text();
  let data={};
  try{data=text?JSON.parse(text):{};}catch{data={message:text};}
  if(!response.ok){
    if(response.status===401){
      showLogin("Igihe cyo gukoresha cyarangiye. Ongera winjire.");
    }
    throw new Error(data.error||data.message||("Ikibazo cya server ("+response.status+")."));
  }
  return data;
}

function showLogin(message=""){
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("loginMessage").textContent=message;
}
function showApp(){
  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userChip").textContent=(currentUser?.name||currentUser?.username||"Umukoresha")+" · "+(currentUser?.role||"");
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const button=e.submitter;
  button.disabled=true;
  $("loginMessage").textContent="Birimo kugenzura...";
  try{
    const result=await api("/api/login",{method:"POST",body:{
      username:$("username").value.trim(),
      password:$("password").value
    }});
    currentUser=result.user||result;
    await loadApp();
  }catch(err){
    $("loginMessage").textContent=err.message;
  }finally{button.disabled=false;}
});

$("logoutBtn").addEventListener("click",async()=>{
  try{await api("/api/logout",{method:"POST",body:{}});}catch(e){}
  currentUser=null;
  showLogin();
});
$("refreshBtn").addEventListener("click",()=>loadApp().catch(e=>toast(e.message,true)));

document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentPage=btn.dataset.page;
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b===btn));
    renderPage();
  });
});

function isAdmin(){
  const role=String(currentUser?.role||"").toLowerCase();
  return role==="admin"||role==="administrator"||role==="umuyobozi";
}
function val(obj,...keys){
  for(const key of keys) if(obj && obj[key]!==undefined && obj[key]!==null) return obj[key];
  return "";
}
function listFrom(data,...keys){
  for(const key of keys) if(Array.isArray(data?.[key])) return data[key];
  return [];
}
function productName(id){
  const p=productsCache.find(x=>String(val(x,"id","productId"))===String(id));
  return p?val(p,"name","productName","title"):"Igicuruzwa #"+id;
}
function branchName(id){
  const b=branchesCache.find(x=>String(val(x,"id","branchId"))===String(id));
  return b?val(b,"name","branchName"):"Ishami #"+id;
}
function table(headers,rows){
  if(!rows.length) return '<div class="empty">Nta makuru arahari.</div>';
  return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+escapeHTML(h)+'</th>').join("")+'</tr></thead><tbody>'+
    rows.map(row=>'<tr>'+row.map(cell=>'<td>'+cell+'</td>').join("")+'</tr>').join("")+
    '</tbody></table></div>';
}
function panel(title,body,subtitle=""){
  return '<section class="panel"><div class="panel-head"><div><h2>'+escapeHTML(title)+'</h2>'+(subtitle?'<p>'+escapeHTML(subtitle)+'</p>':"")+'</div></div>'+body+'</section>';
}
function stat(title,value,icon,note){
  return '<div class="stat-card"><div class="stat-top"><span>'+escapeHTML(title)+'</span><span class="stat-icon">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-note">'+escapeHTML(note||"Raporo ya sisitemu")+'</div></div>';
}
function pageHead(title,description,action=""){
  return '<div class="page-head"><div><h1>'+escapeHTML(title)+'</h1><p>'+escapeHTML(description)+'</p></div>'+action+'</div>';
}
function optionList(items,selected=""){
  return items.map(item=>{
    const id=val(item,"id","branchId","productId");
    const name=val(item,"name","branchName","productName","title");
    return '<option value="'+escapeHTML(id)+'" '+(String(id)===String(selected)?"selected":"")+'>'+escapeHTML(name)+'</option>';
  }).join("");
}

async function loadApp(){
  $("mainContent").innerHTML='<div class="loading">Birimo kuvugurura amakuru...</div>';
  try{
    const me=await api("/api/me");
    currentUser=me.user||me;
    if(!currentUser||currentUser===null||me.user===null){
      showLogin();
      return;
    }
    showApp();
    const result=await api("/api/data");
    appData=result.data||result.state?.data||result;
    productsCache=listFrom(appData,"products","items");
    branchesCache=listFrom(appData,"branches","stores");
    renderPage();
  }catch(err){
    $("mainContent").innerHTML='<div class="notice error">'+escapeHTML(err.message)+'</div><button class="primary" onclick="loadApp()">Ongera ugerageze</button>';
    if(!currentUser) showLogin(err.message);
  }
}

function renderPage(){
  if(!currentUser)return;
  $("userChip").textContent=(currentUser.name||currentUser.username||"Umukoresha")+" · "+(currentUser.role||"");
  const pages={
    dashboard:renderDashboard,
    products:renderProducts,
    warehouse:renderWarehouse,
    transfers:renderTransfers,
    sales:renderSales,
    history:renderHistory,
    movements:renderMovements,
    reports:renderReports,
    users:renderUsers
  };
  const fn=pages[currentPage]||renderDashboard;
  if(!isAdmin() && ["warehouse","transfers","movements","users"].includes(currentPage)){
    currentPage="dashboard";
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));
    renderDashboard();
    return;
  }
  fn();
}

function renderDashboard(){
  const products=listFrom(appData,"products","items");
  const sales=listFrom(appData,"sales","saleHistory");
  const branches=listFrom(appData,"branches","stores");
  const warehouse=listFrom(appData,"warehouseStock","warehouse","mainStock");
  const totalSales=sales.reduce((sum,s)=>sum+Number(val(s,"total","totalAmount","amount")||0),0);
  const totalStock=warehouse.reduce((sum,x)=>sum+Number(val(x,"quantity","stock","qty")||0),0);
  const recent=sales.slice(-6).reverse().map(s=>[
    escapeHTML(val(s,"id","saleId")||"—"),
    escapeHTML(val(s,"customerName","customer_name")||"Umukiriya"),
    money(val(s,"total","totalAmount","amount")),
    '<span class="badge green">Byakozwe</span>',
    escapeHTML(dateText(val(s,"createdAt","created_at","date")))
  ]);
  $("mainContent").innerHTML=
    pageHead("Incamake","Reba uko ubucuruzi n'amashami bihagaze.")+
    '<div class="cards">'+
    stat("Ibicuruzwa",products.length,"▣","Ibicuruzwa biri muri sisitemu")+
    stat("Amashami",branches.length,"🏬","Amashami yanditswe")+
    stat("Igurisha ryose",money(totalSales),"↗","Ukurikije amateka aboneka")+
    stat("Stock y'ububiko",money(totalStock),"▤","Ibice biri mu bubiko bukuru")+
    '</div>'+
    '<div class="content-grid">'+
    panel("Ibikorwa byihuse",'<div class="quick-actions">'+
      '<button onclick="goPage(\'sales\')"><span>🛒</span><div><b>Gurisha</b><div class="small muted">Andika igurisha rishya</div></div></button>'+
      (isAdmin()?'<button onclick="goPage(\'warehouse\')"><span>📦</span><div><b>Ongeramo stock</b><div class="small muted">Ububiko bukuru</div></div></button>':'')+
      (isAdmin()?'<button onclick="goPage(\'transfers\')"><span>⇄</span><div><b>Kohereza stock</b><div class="small muted">Ohereza ku ishami</div></div></button>':'')+
      '<button onclick="goPage(\'history\')"><span>◷</span><div><b>Amateka</b><div class="small muted">Reba ibyagurishijwe</div></div></button>'+
    '</div>')+
    panel("Amashami",branches.length?branches.map(b=>'<div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px"><b>'+escapeHTML(val(b,"name","branchName"))+'</b><span class="badge blue">Ishami</span></div>').join(""):'<div class="empty">Nta mashami yagaragajwe.</div>')+
    '</div>'+
    panel("Ibyagurishijwe vuba",table(["Nimero","Umukiriya","Amafaranga","Imiterere","Itariki"],recent));
}
function goPage(page){
  currentPage=page;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  renderPage();
}

function renderProducts(){
  const products=listFrom(appData,"products","items");
  $("mainContent").innerHTML=pageHead("Ibicuruzwa","Reba ibicuruzwa biri muri sisitemu.")+
    '<div class="panel"><div class="toolbar"><input id="productSearch" placeholder="Shakisha igicuruzwa..."><button class="secondary" onclick="loadApp()">↻ Kuvugurura</button></div><div id="productTable"></div></div>';
  const draw=()=>{
    const q=$("productSearch").value.toLowerCase();
    const rows=products.filter(p=>String(val(p,"name","productName","title")).toLowerCase().includes(q)).map(p=>[
      '<b>'+escapeHTML(val(p,"name","productName","title"))+'</b>',
      escapeHTML(val(p,"sku","code")||"—"),
      money(val(p,"price","sellingPrice","salePrice")),
      escapeHTML(val(p,"unit","measurement")||"Igice"),
      '<span class="badge blue">'+escapeHTML(val(p,"id")||"—")+'</span>'
    ]);
    $("productTable").innerHTML=table(["Igicuruzwa","Kode","Igiciro","Igipimo","ID"],rows);
  };
  $("productSearch").addEventListener("input",draw);draw();
}

function renderWarehouse(){
  if(!isAdmin())return;
  const stock=listFrom(appData,"warehouseStock","warehouse","mainStock");
  const rows=stock.map(s=>[
    escapeHTML(productName(val(s,"productId","product_id","id"))),
    '<b>'+escapeHTML(val(s,"quantity","stock","qty")||0)+'</b>',
    escapeHTML(val(s,"unit")||"Igice")
  ]);
  $("mainContent").innerHTML=pageHead("Ububiko bukuru","Admin ni we wongera stock mu bubiko.")+

  const myBranch=val(currentUser,"branchId","branch_id");
  const branchOptions=isAdmin()?'<option value="">Hitamo ishami</option>'+optionList(branches):optionList(branches,myBranch);
  $("mainContent").innerHTML=pageHead("Gurisha","Andika umukiriya n'ibicuruzwa aguze.")+
    '<div class="panel"><form id="saleForm">'+
    '<h2 style="margin-top:0">Amakuru y\'umukiriya</h2><div class="grid-2">'+
    '<div class="form-group"><label for="customerName">Amazina y\'umukiriya *</label><input id="customerName" name="customerName" type="text" placeholder="Andika amazina y\'umukiriya" required></div>'+
    '<div class="form-group"><label for="customerPhone">Telefoni y\'umukiriya *</label><input id="customerPhone" name="customerPhone" type="tel" placeholder="Andika nimero ya telefoni" required></div>'+
    (isAdmin()?'<div class="form-group"><label>Ishami rigurisha *</label><select id="saleBranch" required>'+branchOptions+'</select></div>':'<input id="saleBranch" type="hidden" value="'+escapeHTML(myBranch)+'">')+
    '</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0">'+
    '<div class="panel-head"><div><h2>Ibicuruzwa bigurwa</h2><p>Hitamo ibicuruzwa n\'umubare wabyo.</p></div><button class="secondary" id="addSaleLine" type="button">+ Ongeraho</button></div>'+
    '<div id="saleLines"></div><div style="display:flex;justify-content:space-between;align-items:center;padding:15px;background:#f8faff;border-radius:12px;margin:15px 0"><b>Igiteranyo</b><strong id="saleTotal" style="font-size:23px;color:var(--primary)">0 RWF</strong></div>'+
    '<div class="form-actions"><button class="primary" type="submit">✓ Emeza igurisha</button><button class="secondary" type="reset">Siba amakuru</button></div></form></div>'+
    '<div class="notice">Ibyo ugurisha bigomba kuba bifite stock ihagije ku ishami. Menya neza ko amazina na telefoni by\'umukiriya byanditswe neza.</div>';
  saleLines=[];
  addSaleLine();
  $("addSaleLine").addEventListener("click",addSaleLine);
  $("saleForm").addEventListener("reset",()=>setTimeout(()=>{saleLines=[];addSaleLine();},0));

}

function addSaleLine(){
  const id=Date.now()+Math.floor(Math.random()*1000);
  saleLines.push({id,productId:"",quantity:1,price:0});
  drawSaleLines();
}
function drawSaleLines(){
  const container=$("saleLines");
  if(!container)return;
  container.innerHTML=saleLines.map(line=>
    '<div class="product-line" data-line="'+line.id+'">'+
    '<select class="line-product" aria-label="Igicuruzwa"><option value="">Hitamo igicuruzwa</option>'+optionList(productsCache,line.productId)+'</select>'+
    '<input class="line-qty" aria-label="Umubare" type="number" min="1" step="any" value="'+line.quantity+'" required>'+
    '<input class="line-price" aria-label="Igiciro" type="number" min="0" step="any" value="'+line.price+'" required>'+
    '<button type="button" class="danger line-remove" title="Kuraho">×</button></div>'
  ).join("");
  container.querySelectorAll(".product-line").forEach(el=>{
    const id=Number(el.dataset.line);
    const line=saleLines.find(x=>x.id===id);
    el.querySelector(".line-product").addEventListener("change",e=>{
      line.productId=e.target.value;
      const p=productsCache.find(x=>String(val(x,"id","productId"))===String(line.productId));
      line.price=Number(val(p,"price","sellingPrice","salePrice")||0);
      drawSaleLines();
    });
    el.querySelector(".line-qty").addEventListener("input",e=>{line.quantity=Number(e.target.value)||0;updateSaleTotal();});
    el.querySelector(".line-price").addEventListener("input",e=>{line.price=Number(e.target.value)||0;updateSaleTotal();});
    el.querySelector(".line-remove").addEventListener("click",()=>{
      if(saleLines.length===1){toast("Ugomba kugira nibura igicuruzwa kimwe.",true);return;}
      saleLines=saleLines.filter(x=>x.id!==id);drawSaleLines();
    });
  });
  updateSaleTotal();
}
function updateSaleTotal(){
  const total=saleLines.reduce((sum,l)=>sum+(Number(l.quantity)||0)*(Number(l.price)||0),0);
  if($("saleTotal"))$("saleTotal").textContent=money(total);
}
async function submitSale(e){
  e.preventDefault();
  const customerName=$("customerName").value.trim();
  const customerPhone=$("customerPhone").value.trim();
  const branchId=$("saleBranch").value;
  if(!customerName||!customerPhone){toast("Andika amazina na telefoni by'umukiriya.",true);return;}
  if(!branchId){toast("Hitamo ishami rigurisha.",true);return;}
  if(!saleLines.length||saleLines.some(l=>!l.productId||l.quantity<=0||l.price<0)){
    toast("Reba neza ibicuruzwa, umubare n'ibiciro.",true);return;
  }
  const submit=e.submitter;
  submit.disabled=true;
  try{
    const result=await api("/api/sale",{method:"POST",body:{
      branchId,
      customerName,
      customerPhone,
      items:saleLines.map(l=>({productId:l.productId,quantity:l.quantity,price:l.price}))
    }});
    toast("Igurisha ryabitswe neza.");
    if(result.saleId||result.id) printReceipt({
      id:result.saleId||result.id,
      customerName,customerPhone,branchId,
      items:saleLines.map(l=>({...l,name:productName(l.productId)})),
      total:result.total??saleLines.reduce((s,l)=>s+l.quantity*l.price,0),
      createdAt:new Date().toISOString()
    });
    await loadApp();
  }catch(err){toast(err.message,true);}
  finally{submit.disabled=false;}
}

function printReceipt(sale){
  const w=window.open("","_blank","width=420,height=650");
  if(!w){toast("Browser yabujije gufungura inyemezabuguzi. Emerera pop-ups.",true);return;}
  const items=sale.items.map(i=>'<tr><td>'+escapeHTML(i.name||productName(i.productId))+' × '+escapeHTML(i.quantity)+'</td><td style="text-align:right">'+money(i.quantity*i.price)+'</td></tr>').join("");
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Inyemezabuguzi</title><style>body{font-family:Arial,sans-serif;max-width:340px;margin:20px auto;color:#111}h2{text-align:center;margin-bottom:4px}.center{text-align:center}.line{border-top:1px dashed #777;margin:14px 0}table{width:100%;border-collapse:collapse}td{padding:7px 0;font-size:12px}.total{font-size:18px;font-weight:bold;display:flex;justify-content:space-between}@media print{@page{size:80mm auto;margin:5mm}body{margin:0}}</style></head><body><h2>REPORT 1</h2><div class="center">INYEMEZABUGUZI</div><div class="line"></div><p>Nimero: '+escapeHTML(sale.id)+'</p><p>Umukiriya: '+escapeHTML(sale.customerName)+'</p><p>Telefoni: '+escapeHTML(sale.customerPhone)+'</p><p>Ishami: '+escapeHTML(branchName(sale.branchId))+'</p><p>Itariki: '+escapeHTML(dateText(sale.createdAt))+'</p><div class="line"></div><table>'+items+'</table><div class="line"></div><div class="total"><span>IGITERANYO</span><span>'+money(sale.total)+'</span></div><div class="line"></div><div class="center">Murakoze kutugana!</div><script>window.onload=()=>window.print();<\/script></body></html>');
  w.document.close();
}
